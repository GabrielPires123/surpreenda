services:
  db:
    image: postgres:16-alpine
    container_name: surpreenda-db
    environment:
      POSTGRES_DB: surpreenda
      POSTGRES_USER: surpreenda
      POSTGRES_PASSWORD: surpreenda
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surpreenda"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surpreenda-app
    environment:
      DATABASE_URL: "postgresql://surpreenda:surpreenda@db:5432/surpreenda?serverVersion=16&charset=utf8"
      APP_ENV: dev
      APP_SECRET: a3f2e9c8b1d4a5f6e7c8b9d0a1f2e3c4
      MAILER_DSN: "smtp://localhost"
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - ./var:/var/www/html/var
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && php -S 0.0.0.0:8000 -t public"

volumes:
  db_data:
