services:
  database:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: surpreenda
      POSTGRES_PASSWORD: '!ChangeMe!'
      POSTGRES_USER: app
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - database
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: 'postgresql://app:!ChangeMe!@database:5432/surpreenda?serverVersion=16&charset=utf8'

  mailer:
    image: 'axllent/mailpit'
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
